<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadeau d'anniversaires</title>
<style>
  :root{
    --ink:#1B2E28;
    --ink-deep:#12211D;
    --paper:#F6EFE2;
    --paper-line:#E4D9C2;
    --gold:#D9A441;
    --coral:#E4633F;
    --plum:#8C5383;
    --sage:#6B8F71;
    --muted:#7C8A83;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:radial-gradient(ellipse at top, #24392F 0%, var(--ink) 55%, var(--ink-deep) 100%);
    color:var(--paper);
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  .lights{
    display:flex;justify-content:center;gap:10px;margin-bottom:18px;
  }
  .lights span{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 2px rgba(217,164,65,0.7);
    animation:glow 2.4s ease-in-out infinite;
  }
  .lights span:nth-child(2n){background:var(--coral);box-shadow:0 0 8px 2px rgba(228,99,63,0.6);animation-delay:.4s;}
  .lights span:nth-child(3n){background:var(--sage);box-shadow:0 0 8px 2px rgba(107,143,113,0.6);animation-delay:.8s;}
  @keyframes glow{0%,100%{opacity:.5;transform:scale(0.85);}50%{opacity:1;transform:scale(1.15);}}

  h1{
    font-family:Georgia,'Iowan Old Style',serif;
    font-size:26px;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:.3px;
  }
  .sub{
    text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px;
  }

  /* Identity screen */
  .card-select{
    background:var(--paper);color:var(--ink);border-radius:14px;
    padding:22px 20px;box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }
  .card-select h2{
    font-family:Georgia,serif;font-size:19px;margin:0 0 6px;
  }
  .card-select p{color:#5c6660;font-size:13.5px;margin:0 0 18px;line-height:1.5;}
  .pick-btn{
    display:block;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--paper-line);
    border-radius:10px;padding:13px 14px;margin-bottom:9px;
    font-size:15px;color:var(--ink);cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .pick-btn:active{transform:scale(0.98);}
  .pick-btn:hover{border-color:var(--coral);}
  .pick-btn.guest{color:var(--muted);font-style:italic;}

  /* Tabs styled as luggage tags */
  .tabs{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(96px,1fr));
    gap:7px;margin-bottom:18px;
  }
  .tab{
    position:relative;
    background:var(--paper);color:var(--ink);
    padding:10px 8px;min-height:44px;display:flex;align-items:center;justify-content:center;
    text-align:center;border-radius:10px;border-left:4px solid currentColor;
    font-size:12px;font-weight:700;line-height:1.25;white-space:normal;
    cursor:pointer;opacity:.55;border-top:2px dashed transparent;border-right:2px dashed transparent;border-bottom:2px dashed transparent;
    transition:opacity .15s, border-color .15s;
  }
  .tab.active{opacity:1;border-top-color:currentColor;border-right-color:currentColor;border-bottom-color:currentColor;}
  .tab .badge{
    display:block;margin-top:3px;font-size:10.5px;font-weight:600;
    background:rgba(0,0,0,0.08);padding:1px 6px;border-radius:8px;
  }

  .panel{
    background:var(--paper);color:var(--ink);border-radius:14px;
    padding:20px;box-shadow:0 12px 30px rgba(0,0,0,0.3);
  }
  .panel h2{font-family:Georgia,serif;font-size:20px;margin:0 0 2px;}
  .panel .role{font-size:12.5px;color:var(--muted);margin-bottom:16px;}

  .gift-form{display:flex;gap:8px;margin-bottom:16px;}
  .gift-form input{
    flex:1;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:12px;font-size:16px;background:#fff;color:var(--ink);
    min-height:44px;
  }
  .gift-form button{
    border:none;border-radius:8px;padding:0 16px;min-height:44px;
    background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;
    cursor:pointer;
  }
  .gift-form button:active{opacity:.85;}

  .gift{
    background:#fff;border:1px dashed var(--paper-line);
    border-radius:10px;padding:12px 14px;margin-bottom:9px;
  }
  .gift-main{display:flex;align-items:flex-start;gap:10px;}
  .gift .txt{flex:1;font-size:14.5px;line-height:1.4;}
  .gift .author{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .del-btn{
    background:none;border:none;color:var(--muted);font-size:16px;
    cursor:pointer;padding:4px 2px;line-height:1;
  }
  .del-btn:hover{color:var(--coral);}
  .del-confirm{display:flex;gap:6px;align-items:center;}
  .del-confirm button{
    border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .del-confirm .yes{background:var(--coral);color:#fff;}
  .del-confirm .no{background:#eee;color:var(--ink);}
  .rank-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .rank-btn{
    border:1.5px solid var(--paper-line);background:#fff;
    border-radius:20px;padding:7px 11px;font-size:12.5px;font-weight:600;
    cursor:pointer;color:var(--ink);
  }
  .rank-btn.active.r3{background:var(--gold);border-color:var(--gold);color:#fff;}
  .rank-btn.active.r2{background:#B7B7B7;border-color:#B7B7B7;color:#fff;}
  .rank-btn.active.r1{background:#B08D57;border-color:#B08D57;color:#fff;}
  .score-badge{
    margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sage);
  }
  .vote-hint{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:8px 0;}

  .comment-block{margin-top:10px;}
  .comment-label{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block;}
  .comment-block textarea{
    width:100%;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:9px 10px;font-size:13.5px;font-family:inherit;color:var(--ink);
    background:#fdfaf4;resize:vertical;min-height:44px;
  }
  .comment-read{font-size:13px;color:#5c6660;font-style:italic;background:#fdfaf4;border-radius:8px;padding:8px 10px;line-height:1.4;white-space:pre-wrap;}

  .participate-block{margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--paper-line);}
  .participate-btn{
    display:block;width:100%;border-radius:10px;border:1.5px solid var(--sage);
    background:#fff;color:var(--sage);font-size:14.5px;font-weight:700;
    padding:13px;min-height:46px;cursor:pointer;margin-bottom:10px;
  }
  .participate-btn.joined{background:var(--sage);color:#fff;}
  .participants-list .hint{margin-top:0;}

  .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .link-btn{
    background:none;border:none;color:rgba(246,239,226,0.6);
    font-size:12.5px;cursor:pointer;text-decoration:underline;padding:6px 0;
  }
  .loading{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  .admin-toggle{
    position:fixed;top:14px;right:14px;z-index:20;
    width:40px;height:40px;border-radius:50%;
    background:rgba(246,239,226,0.12);border:1px solid rgba(246,239,226,0.25);
    color:var(--paper);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:30;
  }
  @media (min-width:560px){ .overlay{align-items:center;} }
  .modal{
    background:var(--paper);color:var(--ink);width:100%;max-width:520px;
    max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;
    padding:22px 20px 28px;
  }
  @media (min-width:560px){ .modal{border-radius:16px;} }
  .modal h2{font-family:Georgia,serif;font-size:19px;margin:0 0 14px;}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 5px;}
  .modal input[type=text],.modal input[type=password]{
    width:100%;border:1.5px solid var(--paper-line);border-radius:8px;
    padding:11px 12px;font-size:16px;background:#fff;color:var(--ink);min-height:44px;
  }
  .person-block{border:1px dashed var(--paper-line);border-radius:10px;padding:12px 14px;margin-top:14px;}
  .person-block .pb-title{font-weight:700;font-size:13.5px;margin-bottom:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{
    font-size:12.5px;padding:6px 10px;border-radius:14px;
    background:#fff;border:1.5px solid var(--paper-line);cursor:pointer;color:var(--ink);
  }
  .chip.excluded{background:var(--coral);border-color:var(--coral);color:#fff;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions button{
    flex:1;border:none;border-radius:8px;padding:13px;font-size:14.5px;font-weight:600;
    cursor:pointer;min-height:46px;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-secondary{background:#fff;border:1.5px solid var(--paper-line) !important;color:var(--ink);}
  .modal-close{
    position:absolute;top:14px;right:16px;background:none;border:none;
    font-size:22px;color:var(--muted);cursor:pointer;line-height:1;
  }
  .modal-inner{position:relative;}
  .hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
</style>
</head>
<body>
<button class="admin-toggle" id="admin-toggle" title="Administration" aria-label="Administration">⚙</button>
<div class="wrap">
  <div class="lights"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <h1>🎁 Cadeau d'anniversaires</h1>
  <div class="sub">Parcours les différents onglets pour dire si tu souhaites participer au cadeau, proposer des idées et voter.</div>
  <div id="app"><div class="loading">Chargement…</div></div>
</div>

<script>
const ACCENTS = ['#E4633F','#D9A441','#8C5383','#6B8F71','#3F6E8E'];

/* ==========================================================================
   CONFIGURATION OBLIGATOIRE — à faire une seule fois avant de partager le lien

   1) Crée un compte gratuit sur https://jsonbin.io/create-account
   2) Une fois connecté, va sur https://jsonbin.io/app/api-keys et copie ta
      "X-Master-Key" (clé qui commence en général par $2a$...).
   3) Crée le bin (l'espace de stockage) avec cette commande dans un terminal,
      en remplaçant TA_CLE par la clé copiée à l'étape 2 :

      curl -X POST https://api.jsonbin.io/v3/b \
        -H "Content-Type: application/json" \
        -H "X-Master-Key: TA_CLE" \
        -H "X-Bin-Private: false" \
        -d '{"seedVersion":0,"resetVersion":0}'

      La réponse contient "metadata": { "id": "XXXXXXXXXXXX", ... }
      → c'est ce "id" qu'il faut copier.

      (Sans terminal sous la main : connecte-toi sur jsonbin.io, utilise le
      bouton "Create Bin" du tableau de bord, colle {"seedVersion":0,"resetVersion":0}
      et enregistre — l'id du bin apparaît dans l'URL de la page.)

   4) Colle ta clé et l'id du bin ci-dessous, à la place des valeurs d'exemple.
   ========================================================================== */
const JSONBIN_API_KEY = '$2a$10$E5OtR2JBKLtG76J6c31eReI23MY5H6TMVP6h1uGnKoZ6L1.1LI3zq';
const JSONBIN_BIN_ID = '6a79f6a1da38895dfed1a144';
const DATA_PATH = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;
const IDENTITY_KEY = 'cadeaux-identity';

let appData = null;
let identity = null; // string name or 'guest'
let activeTab = null;
let isAdminSession = false;
let pendingDeleteGiftId = null;
let pendingDeleteTabId = null;

const el = document.getElementById('app');

function uid(){ return Math.random().toString(36).slice(2,9); }

const SEED_VERSION = 3;
const RESET_VERSION = 1;
const GUEST_LIST = ['Dadou','Marion P.','Marion C.','Mojo','Tony','Chris','Andrea','Berenice','Ceydoux','Chloé','Lucas','Nathan','Svea','Tom','Wolff','Gio'];
const SEED_PEOPLE = [
  {id:'p1', name:'Pot de départ Dadou', type:'depart', hiddenFrom:['Dadou']},
  {id:'p2', name:'Anniversaire Mojo', type:'birthday', hiddenFrom:['Mojo']},
  {id:'p3', name:'Anniversaire Marion P.', type:'birthday', hiddenFrom:['Marion P.']},
  {id:'p4', name:'Remerciement Chris & Andrea', type:'host', hiddenFrom:['Chris','Andrea']},
  {id:'p5', name:'Anniversaire Svea', type:'birthday', hiddenFrom:['Svea']}
];

function sortedNames(list){
  return list.slice().sort((a,b)=> a.localeCompare(b, 'fr', {sensitivity:'base'}));
}

let storageConfigError = false;

async function loadData(){
  if(JSONBIN_API_KEY.includes('REMPLACE_MOI') || JSONBIN_BIN_ID.includes('REMPLACE_MOI')){
    storageConfigError = true;
    appData = { adminPin: null, people: [], gifts: {}, contributors: {}, guestList: [], seedVersion: 0 };
    return;
  }
  try{
    const res = await fetch(DATA_PATH + '/latest', {
      headers:{
        'X-Master-Key': JSONBIN_API_KEY,
        'X-Bin-Meta': 'false'
      }
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(!json || typeof json !== 'object') throw new Error('Réponse invalide');
    appData = json;
  }catch(e){
    console.error('Erreur de chargement JSONBin', e);
    storageConfigError = true;
    appData = {
      adminPin: null,
      people: [],
      gifts: {},
      contributors: {},
      guestList: [],
      seedVersion: 0
    };
    return;
  }
  // migration : s'assurer que chaque personne a bien un tableau hiddenFrom
  if(!appData.people) appData.people = [];
  appData.people.forEach(p=>{ if(!p.hiddenFrom) p.hiddenFrom = []; });
  if(appData.adminPin === undefined) appData.adminPin = null;
  if(!appData.contributors) appData.contributors = {};
  if(!appData.gifts) appData.gifts = {};
  if(!appData.guestList) appData.guestList = [];

  // seed / mise à jour : n'AJOUTE que les nouveaux onglets et participants, sans écraser tes personnalisations admin
  if(!appData.seedVersion || appData.seedVersion < SEED_VERSION){
    SEED_PEOPLE.forEach(sp=>{
      if(!appData.people.find(p=>p.id===sp.id)){
        appData.people.push({...sp});
      }
    });
    GUEST_LIST.forEach(n=>{
      if(!appData.guestList.includes(n)) appData.guestList.push(n);
    });
    appData.people.forEach(p=>{
      if(!appData.gifts[p.id]) appData.gifts[p.id] = [];
      if(!appData.contributors[p.id]) appData.contributors[p.id] = [];
    });
    appData.seedVersion = SEED_VERSION;
    await saveData();
  }

  appData.people.forEach(p=>{ if(!appData.contributors[p.id]) appData.contributors[p.id] = []; });
  appData.people.forEach(p=>{ if(!appData.gifts[p.id]) appData.gifts[p.id] = []; });

  // migration : l'ancien système de votes (tableau de noms) devient un objet {votant: points}
  Object.values(appData.gifts).forEach(list=>{
    list.forEach(g=>{
      if(Array.isArray(g.votes)) g.votes = {};
      if(!g.votes) g.votes = {};
      if(g.comment === undefined) g.comment = '';
    });
  });

  // purge unique des données de test (idées et participants ajoutés pendant les essais)
  if(!appData.resetVersion || appData.resetVersion < RESET_VERSION){
    appData.gifts = {};
    appData.contributors = {};
    appData.people.forEach(p=>{
      appData.gifts[p.id] = [];
      appData.contributors[p.id] = [];
    });
    appData.resetVersion = RESET_VERSION;
    await saveData();
  }
}

async function saveData(){
  if(storageConfigError) return;
  const res = await fetch(DATA_PATH, {
    method:'PUT',
    headers:{
      'Content-Type':'application/json',
      'X-Master-Key': JSONBIN_API_KEY,
      'X-Bin-Versioning': 'false'
    },
    body: JSON.stringify(appData)
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}

// Identité mémorisée localement dans le navigateur (page normale, pas de sandbox Claude)
async function loadIdentity(){
  try{
    identity = localStorage.getItem(IDENTITY_KEY);
  }catch(e){
    identity = null;
  }
}

async function saveIdentity(name){
  identity = name;
  try{ localStorage.setItem(IDENTITY_KEY, name); }catch(e){}
}

async function clearIdentity(){
  identity = null;
  try{ localStorage.removeItem(IDENTITY_KEY); }catch(e){}
  render();
}

function giftScore(g){
  return Object.values(g.votes||{}).reduce((s,v)=>s+v,0);
}

function roleText(type){
  if(type === 'depart') return "Cagnotte pour son pot de départ";
  if(type === 'host') return "Pour les remercier de leur accueil";
  if(type === 'other') return "Idées et cadeaux pour cette occasion";
  return "Idées cadeaux pour son anniversaire";
}

function visiblePeople(){
  return appData.people.filter(p => p.name !== identity && !(p.hiddenFrom||[]).includes(identity));
}

function knownIdentities(){
  const names = new Set();
  appData.people.forEach(p=>names.add(p.name));
  Object.values(appData.gifts).forEach(list=>{
    list.forEach(g=>{ names.add(g.author); Object.keys(g.votes||{}).forEach(v=>names.add(v)); });
  });
  Object.values(appData.contributors||{}).forEach(list=>{
    list.forEach(n=>names.add(n));
  });
  names.delete('guest');
  return Array.from(names);
}

async function init(){
  await loadData();
  await loadIdentity();
  render();
}

function render(){
  if(storageConfigError){
    el.innerHTML = `
      <div class="card-select">
        <h2>⚠️ Configuration manquante</h2>
        <p>La sauvegarde des données (JSONBin.io) n'est pas encore configurée dans ce fichier. Ouvre le code source, remplace <code>JSONBIN_API_KEY</code> et <code>JSONBIN_BIN_ID</code> par tes propres valeurs (voir le commentaire juste au-dessus dans le script), puis recharge la page.</p>
      </div>
    `;
    return;
  }
  if(!identity){ renderIdentityScreen(); return; }
  renderMain();
}

function renderIdentityScreen(){
  const names = sortedNames(appData.guestList && appData.guestList.length ? appData.guestList : appData.people.map(p=>p.name));
  const options = names.map(n =>
    `<button class="pick-btn" data-name="${escapeAttr(n)}">${escapeHtml(n)}</button>`
  ).join('');
  el.innerHTML = `
    <div class="card-select">
      <h2>Qui es-tu ?</h2>
      <p>Choisis ton nom dans la liste. Si tu fêtes ton anniversaire, l'onglet qui te concerne restera caché — surprise garantie 🤫</p>
      ${options}
      <button class="pick-btn guest" data-name="__guest__">Je ne suis dans aucune de ces 4 personnes</button>
    </div>
  `;
  el.querySelectorAll('.pick-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.getAttribute('data-name');
      await saveIdentity(name === '__guest__' ? 'guest' : name);
      activeTab = null;
      render();
    });
  });
}

function renderMain(){
  const people = visiblePeople();
  if(!activeTab || !people.find(p=>p.id===activeTab)){
    activeTab = people[0] ? people[0].id : null;
  }

  const tabsHtml = people.map(p=>{
    const idx = appData.people.findIndex(x=>x.id===p.id);
    const color = ACCENTS[idx % ACCENTS.length];
    const count = (appData.gifts[p.id]||[]).length;
    return `<div class="tab ${p.id===activeTab?'active':''}" style="color:${color}" data-id="${p.id}">
      ${escapeHtml(p.name)}<span class="badge">${count}</span>
    </div>`;
  }).join('');

  let panelHtml = '';
  if(!people.length){
    panelHtml = `<div class="panel"><div class="empty">Aucun onglet visible pour toi pour l'instant.</div></div>`;
  } else {
    const person = appData.people.find(p=>p.id===activeTab);
    const idx = appData.people.findIndex(x=>x.id===activeTab);
    const color = ACCENTS[idx % ACCENTS.length];
    const gifts = (appData.gifts[activeTab]||[]).slice().sort((a,b)=> giftScore(b) - giftScore(a));
    const giftsHtml = gifts.length ? gifts.map(g=>{
      const myRank = g.votes[identity];
      const score = giftScore(g);
      const canDelete = isAdminSession || g.author === identity;
      let deleteHtml = '';
      if(canDelete){
        if(pendingDeleteGiftId === g.id){
          deleteHtml = `<span class="del-confirm">
            <button type="button" class="yes" data-gid="${g.id}" data-action="confirm-del">Supprimer</button>
            <button type="button" class="no" data-gid="${g.id}" data-action="cancel-del">Annuler</button>
          </span>`;
        } else {
          deleteHtml = `<button type="button" class="del-btn" data-gid="${g.id}" data-action="ask-del" title="Supprimer cette idée">🗑</button>`;
        }
      }
      const canEditComment = isAdminSession || g.author === identity;
      const commentHtml = canEditComment
        ? `<div class="comment-block">
            <span class="comment-label">💬 Commentaire (lien, prix, remarque…)</span>
            <textarea data-gid="${g.id}" class="comment-input" rows="2" placeholder="Ajouter un lien, un prix estimatif, une remarque…">${escapeHtml(g.comment||'')}</textarea>
          </div>`
        : (g.comment ? `<div class="comment-block">
            <span class="comment-label">💬 Commentaire</span>
            <div class="comment-read">${escapeHtml(g.comment)}</div>
          </div>` : '');
      return `<div class="gift">
        <div class="gift-main">
          <div class="txt">${escapeHtml(g.text)}<span class="author">proposé par ${escapeHtml(g.author)}</span></div>
          ${deleteHtml}
        </div>
        <div class="rank-row">
          <button type="button" class="rank-btn r3 ${myRank===3?'active':''}" data-gid="${g.id}" data-rank="3">🥇 +3</button>
          <button type="button" class="rank-btn r2 ${myRank===2?'active':''}" data-gid="${g.id}" data-rank="2">🥈 +2</button>
          <button type="button" class="rank-btn r1 ${myRank===1?'active':''}" data-gid="${g.id}" data-rank="1">🥉 +1</button>
          <span class="score-badge">${score} pt${score>1?'s':''}</span>
        </div>
        ${commentHtml}
      </div>`;
    }).join('') : `<div class="empty">Aucune idée pour le moment. Sois le premier !</div>`;

    const participants = appData.contributors[activeTab] || [];
    const participating = participants.includes(identity);

    panelHtml = `
      <div class="panel">
        <h2 style="color:${color}">${escapeHtml(person.name)}</h2>
        <div class="role">${roleText(person.type)}</div>
        <div class="participate-block">
          <button type="button" class="participate-btn ${participating?'joined':''}" id="participate-btn">
            ${participating ? '✅ Je participe au cadeau' : '🤝 Je souhaite participer au cadeau'}
          </button>
          <div class="participants-list">
            ${participants.length ? `<span class="hint">Participent déjà (${participants.length}) : ${participants.map(escapeHtml).join(', ')}</span>` : `<span class="hint">Personne ne s'est encore proposé.</span>`}
          </div>
        </div>
        <div class="gift-form">
          <input type="text" id="gift-input" placeholder="Proposer une idée…" maxlength="140" />
          <button type="button" id="add-gift-btn">Ajouter</button>
        </div>
        <div class="vote-hint">Choisis tes 3 idées préférées : 🥇 ton 1er choix vaut <strong>3 points</strong>, 🥈 le 2e vaut <strong>2 points</strong>, 🥉 le 3e vaut <strong>1 point</strong>. Un clic sur un bouton déjà actif annule ce choix. Le classement se met à jour automatiquement selon les points reçus.</div>
        ${giftsHtml}
      </div>
    `;
  }

  el.innerHTML = `
    <div class="tabs">${tabsHtml}</div>
    ${panelHtml}
    <div class="footer-row">
      <button class="link-btn" id="switch-identity">Changer d'identité (${escapeHtml(identity)})</button>
    </div>
  `;

  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ activeTab = t.getAttribute('data-id'); pendingDeleteGiftId = null; render(); });
  });
  const addBtn = document.getElementById('add-gift-btn');
  const giftInput = document.getElementById('gift-input');
  if(addBtn && giftInput){
    const submitGift = async ()=>{
      const text = giftInput.value.trim();
      if(!text) return;
      appData.gifts[activeTab] = appData.gifts[activeTab] || [];
      appData.gifts[activeTab].push({id:uid(), text, author:identity, votes:{}, comment:''});
      giftInput.value = '';
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      render();
    };
    addBtn.addEventListener('click', submitGift);
    giftInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); submitGift(); }
    });
  }
  const participateBtn = document.getElementById('participate-btn');
  if(participateBtn){
    participateBtn.addEventListener('click', async ()=>{
      appData.contributors[activeTab] = appData.contributors[activeTab] || [];
      const list = appData.contributors[activeTab];
      const i = list.indexOf(identity);
      if(i>=0) list.splice(i,1); else list.push(identity);
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      render();
    });
  }
  el.querySelectorAll('.rank-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const gid = btn.getAttribute('data-gid');
      const rank = parseInt(btn.getAttribute('data-rank'), 10);
      const list = appData.gifts[activeTab];
      const gift = list.find(g=>g.id===gid);
      const current = gift.votes[identity];
      list.forEach(g=>{
        if(g.votes[identity] === rank) delete g.votes[identity];
      });
      if(current !== rank){
        gift.votes[identity] = rank;
      }
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      render();
    });
  });
  el.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const gid = btn.getAttribute('data-gid');
      const action = btn.getAttribute('data-action');
      if(action === 'ask-del'){
        pendingDeleteGiftId = gid;
        render();
      } else if(action === 'cancel-del'){
        pendingDeleteGiftId = null;
        render();
      } else if(action === 'confirm-del'){
        appData.gifts[activeTab] = (appData.gifts[activeTab]||[]).filter(g=>g.id!==gid);
        pendingDeleteGiftId = null;
        try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
        render();
      }
    });
  });
  el.querySelectorAll('.comment-input').forEach(ta=>{
    ta.addEventListener('blur', async ()=>{
      const gid = ta.getAttribute('data-gid');
      const list = appData.gifts[activeTab];
      const gift = list.find(g=>g.id===gid);
      if(!gift) return;
      const val = ta.value;
      if(gift.comment === val) return;
      gift.comment = val;
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
    });
  });
  document.getElementById('switch-identity').addEventListener('click', clearIdentity);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- Administration ---------- */

document.getElementById('admin-toggle').addEventListener('click', openAdmin);

function openAdmin(){
  if(!appData) return;
  renderAdminGate();
}

function renderAdminGate(errorMsg){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'admin-gate-overlay';
  const isNew = !appData.adminPin;
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-inner">
        <button class="modal-close" id="gate-close">×</button>
        <h2>⚙ Administration</h2>
        ${isNew
          ? `<div class="hint">Aucun code admin n'est encore défini. Crée un code (4 chiffres ou plus) pour protéger cette section.</div>
             <label>Nouveau code admin</label>
             <input type="password" inputmode="numeric" id="gate-pin1" placeholder="ex : 2026" />`
          : `<div class="hint">Entre le code admin pour continuer.</div>
             <label>Code admin</label>
             <input type="password" inputmode="numeric" id="gate-pin1" placeholder="Code" />`
        }
        ${errorMsg ? `<div class="hint" style="color:var(--coral);font-weight:600;">${escapeHtml(errorMsg)}</div>` : ''}
        <div class="modal-actions">
          <button class="btn-secondary" id="gate-cancel">Annuler</button>
          <button class="btn-primary" id="gate-confirm">${isNew ? 'Créer et continuer' : 'Valider'}</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const close = ()=> overlay.remove();
  document.getElementById('gate-close').addEventListener('click', close);
  document.getElementById('gate-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  const pinInput = document.getElementById('gate-pin1');
  pinInput.focus();

  const confirmGate = async ()=>{
    const val = pinInput.value.trim();
    if(!val) return;
    if(isNew){
      appData.adminPin = val;
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      isAdminSession = true;
      close();
      renderAdminModal();
    } else {
      if(val === appData.adminPin){
        isAdminSession = true;
        close();
        renderAdminModal();
      } else {
        close();
        renderAdminGate('Code incorrect, réessaie.');
      }
    }
  };
  document.getElementById('gate-confirm').addEventListener('click', confirmGate);
  pinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); confirmGate(); } });
}

function renderAdminModal(){
  const known = sortedNames(appData.guestList && appData.guestList.length ? appData.guestList : knownIdentities());
  const peopleBlocks = appData.people.map((p, idx)=>{
    const chips = known.map(n=>{
      const excluded = (p.hiddenFrom||[]).includes(n);
      return `<button type="button" class="chip ${excluded?'excluded':''}" data-pid="${p.id}" data-name="${escapeAttr(n)}">${excluded?'🚫 ':''}${escapeHtml(n)}</button>`;
    }).join('');
    const delHtml = pendingDeleteTabId === p.id
      ? `<span class="del-confirm">
          <button type="button" class="yes" data-pid="${p.id}" data-action="confirm-del-tab">Supprimer l'onglet</button>
          <button type="button" class="no" data-pid="${p.id}" data-action="cancel-del-tab">Annuler</button>
        </span>`
      : `<button type="button" class="del-btn" data-pid="${p.id}" data-action="ask-del-tab" title="Supprimer cet onglet">🗑 Supprimer cet onglet</button>`;
    return `
      <div class="person-block">
        <div class="pb-title">Onglet ${idx+1}</div>
        <label>Nom affiché</label>
        <input type="text" class="admin-name" data-pid="${p.id}" value="${escapeAttr(p.name)}" />
        <label>Masquer cet onglet pour (clique pour activer/désactiver)</label>
        <div class="chip-row">${chips}</div>
        <div style="margin-top:10px;">${delHtml}</div>
      </div>
    `;
  }).join('');

  const participantChips = known.map(n=>
    `<span class="chip" style="cursor:default;display:inline-flex;align-items:center;gap:6px;">${escapeHtml(n)}<button type="button" data-action="remove-guest" data-name="${escapeAttr(n)}" style="background:none;border:none;color:var(--coral);font-weight:800;cursor:pointer;padding:0;font-size:13px;">×</button></span>`
  ).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'admin-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-inner">
        <button class="modal-close" id="admin-close">×</button>
        <h2>⚙ Administration</h2>
        <div class="hint">Renomme les onglets et choisis qui d'autre ne doit pas voir chaque onglet, en plus de la personne concernée.</div>
        ${peopleBlocks}

        <div class="person-block">
          <div class="pb-title">➕ Ajouter un onglet</div>
          <label>Nom du nouvel onglet</label>
          <input type="text" id="new-tab-name" placeholder="ex : Anniversaire Lucas" />
          <div class="modal-actions" style="margin-top:10px;">
            <button class="btn-primary" type="button" id="add-tab-btn" style="flex:none;padding:10px 18px;">Ajouter l'onglet</button>
          </div>
        </div>

        <div class="person-block">
          <div class="pb-title">👥 Participants (${known.length})</div>
          <div class="chip-row">${participantChips || '<span class="hint">Aucun participant.</span>'}</div>
          <label>Ajouter un participant</label>
          <input type="text" id="new-guest-name" placeholder="Prénom" />
          <div class="modal-actions" style="margin-top:10px;">
            <button class="btn-primary" type="button" id="add-guest-btn" style="flex:none;padding:10px 18px;">Ajouter le participant</button>
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn-secondary" id="admin-cancel">Annuler</button>
          <button class="btn-primary" id="admin-save">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll('.chip[data-pid]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chip.classList.toggle('excluded');
      chip.textContent = (chip.classList.contains('excluded') ? '🚫 ' : '') + chip.getAttribute('data-name');
    });
  });

  const close = ()=> { overlay.remove(); render(); };
  document.getElementById('admin-close').addEventListener('click', close);
  document.getElementById('admin-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  document.getElementById('add-tab-btn').addEventListener('click', async ()=>{
    const input = document.getElementById('new-tab-name');
    const name = input.value.trim();
    if(!name) return;
    const newId = 'p' + uid();
    appData.people.push({id:newId, name, type:'other', hiddenFrom:[]});
    appData.gifts[newId] = [];
    appData.contributors[newId] = [];
    try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
    overlay.remove();
    renderAdminModal();
  });

  document.getElementById('add-guest-btn').addEventListener('click', async ()=>{
    const input = document.getElementById('new-guest-name');
    const name = input.value.trim();
    if(!name) return;
    if(!appData.guestList.includes(name)) appData.guestList.push(name);
    try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
    overlay.remove();
    renderAdminModal();
  });

  overlay.querySelectorAll('[data-action="remove-guest"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const name = btn.getAttribute('data-name');
      appData.guestList = appData.guestList.filter(n=>n!==name);
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      overlay.remove();
      renderAdminModal();
    });
  });

  overlay.querySelectorAll('[data-action="ask-del-tab"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingDeleteTabId = btn.getAttribute('data-pid');
      overlay.remove();
      renderAdminModal();
    });
  });
  overlay.querySelectorAll('[data-action="cancel-del-tab"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingDeleteTabId = null;
      overlay.remove();
      renderAdminModal();
    });
  });
  overlay.querySelectorAll('[data-action="confirm-del-tab"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const pid = btn.getAttribute('data-pid');
      appData.people = appData.people.filter(p=>p.id!==pid);
      delete appData.gifts[pid];
      delete appData.contributors[pid];
      pendingDeleteTabId = null;
      try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
      overlay.remove();
      renderAdminModal();
    });
  });

  document.getElementById('admin-save').addEventListener('click', async ()=>{
    overlay.querySelectorAll('.admin-name').forEach(input=>{
      const pid = input.getAttribute('data-pid');
      const person = appData.people.find(x=>x.id===pid);
      const val = input.value.trim();
      if(val) person.name = val;
    });
    appData.people.forEach(p=>{ p.hiddenFrom = []; });
    overlay.querySelectorAll('.chip.excluded[data-pid]').forEach(chip=>{
      const pid = chip.getAttribute('data-pid');
      const name = chip.getAttribute('data-name');
      const person = appData.people.find(x=>x.id===pid);
      if(person && !person.hiddenFrom.includes(name)) person.hiddenFrom.push(name);
    });
    try{ await saveData(); }catch(e){ console.error('Erreur de sauvegarde', e); }
    overlay.remove();
    render();
  });
}

init();
</script>
</body>
</html>
